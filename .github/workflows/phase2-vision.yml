name: phase2-vision

on:
  push:
    branches: [main]
    paths: ["nexuss_fusion/**", ".github/workflows/phase2-vision.yml"]
  workflow_dispatch:

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.46" "pillow>=10" num2words pytest

      - name: Unit tests
        run: pytest -q

      - name: Generate synthetic calibration images + captions
        run: python scripts/make_synthetic_calib.py bench/calib 24 7

      - name: Cache populates (extractors load HF models)
        run: |
          python -m nexuss_fusion.run.phase2 --images-dir bench/calib --cache features-cache --extract --extract-only

      - name: "Phase 2 fit + held-out eval (synthetic sanity: gates recorded, not enforced)"
        run: python -m nexuss_fusion.run.phase2 --images-dir bench/calib --cache features-cache --out phase2-results --no-strict

      - name: Surface results
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          p = Path("phase2-results/phase2.json")
          r = json.loads(p.read_text()) if p.exists() else {"status": "missing"}
          print(json.dumps(r, indent=2))
          EOF

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-results
          path: |
            phase2-results/
            features-cache/*.pt