name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU torch + deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest ruff mypy
      - name: Ruff lint
        run: ruff check nexuss_fusion tests
      - name: Mypy typecheck
        run: mypy nexuss_fusion
      - name: Pytest (torch backend)
        run: pytest -q
      - name: Backend smoke
        run: python -m nexuss_fusion --backend && python -m nexuss_fusion --list
      - name: Eigen opt-in path (runs only if native module exists)
        run: |
          python - <<'PY'
          from nexuss_fusion.backend import eigen_available, get_backend
          assert eigen_available() is False or get_backend("eigen").name == "eigen"
          print("eigen available:", eigen_available())
          PY