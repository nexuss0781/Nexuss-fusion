name: train-vision

on:
  push:
    branches: [main]
    paths: ["nexuss_fusion/**", "bench/space/**", ".github/workflows/train-vision.yml"]

concurrency:
  group: train-vision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Step 1: Prepare data + extract features + split into chunks
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.46" "pillow>=10" num2words pytest

      - name: Unit tests
        run: pytest -q

      - name: Extract features for SPACE images
        run: |
          python -m nexuss_fusion.run.phase2 --images-dir bench/space --cache features-cache --extract --extract-only

      - name: Split SPACE images into 1 chunk (verify)
        run: |
          python - <<'PYEOF'
          import json, shutil
          from pathlib import Path

          space = Path("bench/space")
          captions_raw = json.loads((space / "captions.json").read_text())
          images = sorted([*space.glob("*.jpg"), *space.glob("*.png")])
          chunk_dir = Path("chunks/chunk_01/images")
          chunk_dir.mkdir(parents=True, exist_ok=True)
          chunk_caps = {}
          for img in images:
              shutil.copy2(img, chunk_dir / img.name)
              if img.name in captions_raw:
                  chunk_caps[img.name] = captions_raw[img.name]
          (Path("chunks/chunk_01") / "captions.json").write_text(
              json.dumps(chunk_caps, indent=2)
          )
          print(f"chunk_01: {len(list(chunk_dir.glob('*')))} images")
          PYEOF

      - name: Upload chunks artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-chunks
          path: chunks/
          retention-days: 1

  # Step 2: Train on chunk 1 (single verify job)
  train:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.46" "pillow>=10" num2words

      - name: Download chunks artifact
        uses: actions/download-artifact@v4
        with:
          name: all-chunks
          path: chunks/

      - name: Extract features for chunk
        run: |
          python -m nexuss_fusion.run.phase2 --images-dir "chunks/chunk_01" --cache features-cache --extract --extract-only

      - name: Train chunk 1
        run: |
          python -m nexuss_fusion.run.train_chunk \
            --chunk-dir "chunks/chunk_01/images" \
            --captions-file "chunks/chunk_01/captions.json" \
            --cache features-cache \
            --out "chunk_01_model" \
            --epochs 50 \
            --checkpoint-every 10 \
            --verbose

      - name: Upload chunk model
        uses: actions/upload-artifact@v4
        with:
          name: chunk-1-model
          path: chunk_01_model/
          retention-days: 7

  # Step 3: Merge (single chunk = just copy)
  merge:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=4.46" "pillow>=10"

      - name: Download chunk model
        uses: actions/download-artifact@v4
        with:
          name: chunk-1-model
          path: chunks/chunk_01

      - name: Merge into final model
        run: |
          python -m nexuss_fusion.run.merge_chunks \
            --chunks-dir chunks \
            --out final_model

      - name: Surface merge info
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          p = Path("final_model/merge_info.json")
          r = json.loads(p.read_text()) if p.exists() else {"status": "missing"}
          print(json.dumps(r, indent=2))
          EOF

      - name: Upload final model
        uses: actions/upload-artifact@v4
        with:
          name: nexuss-fusion-vision-model
          path: final_model/
          retention-days: 30
